name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and select Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked development dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Type check
        run: uv run --locked mypy
      - name: Test SQLite reduction and replay
        run: |
          uv run --locked python -c "from pathlib import Path; Path('.validation').mkdir(exist_ok=True)"
          uv run --locked pytest --basetemp=.validation/pytest
      - name: Build wheel and source distribution
        run: uv build --no-sources
      - name: Inspect distribution metadata and packaged files
        run: |
          uv run --locked python tests/distribution_smoke.py \
            --wheel dist/reproseed-0.1.0-py3-none-any.whl \
            --sdist dist/reproseed-0.1.0.tar.gz
      - name: Install and exercise the wheel outside the checkout
        run: |
          uv run --locked python tests/external_consumer_smoke.py \
            --wheel dist/reproseed-0.1.0-py3-none-any.whl --existing-applications
