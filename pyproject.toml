[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reproseed"
version = "0.1.0"
description = "Reduce SQLite fixtures while preserving an explicitly specified failure"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ReproSeed contributors"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/chambies2015/ReproSeed"
Repository = "https://github.com/chambies2015/ReproSeed"
Issues = "https://github.com/chambies2015/ReproSeed/issues"
Documentation = "https://github.com/chambies2015/ReproSeed/blob/main/docs/getting-started.md"

[project.scripts]
reproseed = "reproseed.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "build>=1.2,<2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/reproseed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/reproseed"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/examples", "/docs", "/benchmarks", "/.github", "/README.md", "/AGENTS.md",
    "/CONTRIBUTING.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.gitignore",
]
exclude = ["**/*.sqlite3", "**/*.db", "**/*-wal", "**/*-shm", "**/*-journal", "**/__pycache__"]
